[package]
name = "sediment"
version = "0.1.1"
edition = "2024"
description = "Sediment - Windows forensic artifact explorer ($MFT, USN journal, Prefetch)"
license-file = "LICENSE.md"
repository = "https://github.com/Nyanites/sediment"
homepage = "https://nyanites.github.io/sediment/"
publish = false

[dependencies]
chrono = "0.4.45"
eframe = "0.36.2"
egui_extras = "0.36.2"
rfd = "0.17.2"
md-5 = "0.10"
flate2 = "1"
sha1 = "0.11"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1.33"

[profile.release]
lto = true
codegen-units = 1
strip = true
